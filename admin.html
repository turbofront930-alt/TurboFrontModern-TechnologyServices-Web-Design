<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدمن Eng Ebrahim Saad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-900 p-6 min-h-screen flex items-center justify-center">

    <!-- شاشة تسجيل الدخول بكلمة المرور -->
    <div id="loginSection" class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2 class="text-xl font-black text-blue-600 mb-2">أدمن Eng Ebrahim Saad</h2>
        <p class="text-xs text-gray-500 mb-6">يرجى إدخال كلمة المرور للوصول إلى لوحة التحكم</p>
        
        <form onsubmit="checkPassword(event)" class="space-y-4">
            <div>
                <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" class="w-full p-3 border rounded-xl text-xs text-center font-bold focus:outline-none focus:border-blue-600" required>
            </div>
            <p id="errorMsg" class="text-red-500 text-xs hidden font-bold">كلمة المرور غير صحيحة!</p>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs transition">
                دخول اللوحة
            </button>
        </form>
    </div>

    <!-- لوحة التحكم الرئيسية (مخفية افتراضياً) -->
    <div id="adminPanel" class="w-full max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl hidden">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-2xl font-black text-blue-600"><i class="fas fa-user-cog me-2"></i>أدمن Eng Ebrahim Saad</h1>
            <div class="flex items-center gap-3">
                <button onclick="logoutAdmin()" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-2 rounded-xl font-bold transition">
                    <i class="fas fa-sign-out-alt me-1"></i> خروج
                </button>
                <a href="index.html" class="text-xs bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-xl font-bold">العودة للموقع الرئيسي</a>
            </div>
        </div>

        <!-- نموذج إضافة مشروع جديد -->
        <form id="addProjectForm" class="space-y-4 mb-10 bg-gray-50 p-6 rounded-2xl border">
            <h3 class="font-bold text-sm text-gray-700 mb-2">إضافة مشروع جديد للمعرض:</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="pTitle" placeholder="اسم المشروع (مثال: متجر صيدلية)" class="p-3 border rounded-xl text-xs" required>
                <input type="text" id="pPrice" placeholder="السعر (اختياري - مثال: 3000)" class="p-3 border rounded-xl text-xs">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="url" id="pLink" placeholder="رابط معاينة الموقع (https://...)" class="p-3 border rounded-xl text-xs" required>
                <input type="url" id="pImage" placeholder="رابط صورة/شعار المشروع (URL)" class="p-3 border rounded-xl text-xs" required>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs transition">
                <i class="fas fa-plus me-1"></i> إضافة المشروع فوراً
            </button>
        </form>

        <!-- قائمة المشاريع الحالية المتاحة للحذف -->
        <h3 class="font-bold text-base mb-4 text-gray-800">المشاريع الحالية المضافة (إمكانية الحذف):</h3>
        <div id="adminProjectsList" class="space-y-3">
            <p class="text-xs opacity-60 text-center py-4">جاري تحميل المشاريع...</p>
        </div>
    </div>

    <!-- سكريبت الحماية والتحكم في Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBI_-xyfznsUZOdDPRRG3TDaxbtgfqteL8",
            authDomain: "turbofront-23e10.firebaseapp.com",
            projectId: "turbofront-23e10",
            storageBucket: "turbofront-23e10.firebasestorage.app",
            messagingSenderId: "989007662566",
            appId: "1:989007662566:web:ab90726f1cd01412459a27"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // التحقق من كلمة المرور
        window.checkPassword = function(e) {
            e.preventDefault();
            const inputPass = document.getElementById('adminPassword').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (inputPass === 'فوفا' || inputPass.toLowerCase() === 'fofa') {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showPanel();
            } else {
                errorMsg.classList.remove('hidden');
            }
        };

        function showPanel() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.body.classList.remove('flex', 'items-center', 'justify-center');
            loadProjects();
        }

        window.logoutAdmin = function() {
            sessionStorage.removeItem('adminLoggedIn');
            location.reload();
        };

        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            showPanel();
        }

        // إضافة مشروع جديد
        document.getElementById('addProjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري الإضافة...";

            try {
                await addDoc(collection(db, "projects"), {
                    title: document.getElementById('pTitle').value,
                    price: document.getElementById('pPrice').value,
                    link: document.getElementById('pLink').value,
                    image: document.getElementById('pImage').value,
                    createdAt: new Date()
                });
                alert('تمت إضافة المشروع بنجاح!');
                document.getElementById('addProjectForm').reset();
            } catch (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "إضافة المشروع فوراً";
            }
        });

        // جلب المشاريع
        function loadProjects() {
            const adminList = document.getElementById('adminProjectsList');
            onSnapshot(collection(db, "projects"), (snapshot) => {
                if (snapshot.empty) {
                    adminList.innerHTML = '<p class="text-xs opacity-60 text-center py-4">لا توجد مشاريع مضافة عبر قاعدة البيانات حتى الآن.</p>';
                    return;
                }

                adminList.innerHTML = snapshot.docs.map(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    return `
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border text-xs">
                            <div class="flex items-center gap-3">
                                <img src="${data.image}" class="w-10 h-10 object-contain rounded-lg border bg-white" onerror="this.src='https://placehold.co/100x100'">
                                <div>
                                    <h4 class="font-bold text-sm text-gray-800">${data.title}</h4>
                                    <span class="text-[10px] text-gray-500">${data.price ? data.price + ' ج.م | ' : ''}${data.link}</span>
                                </div>
                            </div>
                            <button onclick="deleteProject('${id}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-xl font-bold text-[10px] transition flex items-center gap-1">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </div>
                    `;
                }).join('');
            });
        }

        // دالة الحذف
        window.deleteProject = async (id) => {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا المشروع؟')) {
                try {
                    await deleteDoc(doc(db, "projects", id));
                    alert('تم حذف المشروع بنجاح.');
                } catch (err) {
                    alert('خطأ أثناء الحذف: ' + err.message);
                }
            }
        };
    </script>
</body>
</html>
