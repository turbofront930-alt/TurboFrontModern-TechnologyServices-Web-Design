<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Turbo Front</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-900 p-4 min-h-screen flex items-center justify-center">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-blue-600">
        <h2 class="text-xl font-bold mb-4 text-center text-blue-600">إضافة مشروع جديد</h2>
        
        <form id="addProjectForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold mb-1">اسم المشروع</label>
                <input type="text" id="projTitle" placeholder="مثال: متجر حلويات" class="w-full p-3 border rounded-lg text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">رابط المعاينة</label>
                <input type="url" id="projLink" placeholder="https://..." class="w-full p-3 border rounded-lg text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">رابط الصورة (اختياري)</label>
                <input type="url" id="projImg" placeholder="رابط الصورة أو اتركه فارغاً" class="w-full p-3 border rounded-lg text-sm">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                إضافة المشروع الآن
            </button>
        </form>

        <div id="statusMsg" class="mt-4 text-center text-xs font-bold hidden"></div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ضع بيانات مشروعك من Firebase هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('addProjectForm');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "جاري الإضافة...";

            try {
                await addDoc(collection(db, "projects"), {
                    title: document.getElementById('projTitle').value,
                    link: document.getElementById('projLink').value,
                    image: document.getElementById('projImg').value || "https://via.placeholder.com/400x200?text=Project",
                    createdAt: serverTimestamp()
                });

                statusMsg.innerText = "تمت إضافة المشروع بنجاح!";
                statusMsg.className = "mt-4 text-center text-xs font-bold text-green-600";
                statusMsg.classList.remove('hidden');
                form.reset();
            } catch (error) {
                statusMsg.innerText = "حدث خطأ أثناء الإضافة!";
                statusMsg.className = "mt-4 text-center text-xs font-bold text-red-600";
                statusMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "إضافة المشروع الآن";
            }
        });
    </script>
</body>
</html>
