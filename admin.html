<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Turbo Front</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-xl space-y-6">
        
        <!-- نموذج إضافة مشروع جديد -->
        <div class="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-blue-600">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">إضافة مشروع جديد</h2>
            
            <form id="add-project-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-700">اسم المشروع / العميل</label>
                    <input type="text" id="pTitle" placeholder="مثال: متجر خير بلدنا" class="w-full p-3 border rounded-lg text-sm focus:outline-none focus:border-blue-600" required>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-700">رابط معاينة المشروع</label>
                    <input type="url" id="pLink" placeholder="https://example.com" class="w-full p-3 border rounded-lg text-sm focus:outline-none focus:border-blue-600" required>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> إضافة المشروع للمعرض
                </button>
            </form>

            <p id="statusMsg" class="mt-4 text-center text-xs font-bold hidden"></p>
        </div>

        <!-- قسم إدارة وحذف المشاريع الحالية -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border-t-4 border-red-600">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fas fa-tasks text-red-600"></i> المشاريع الحالية في المعرض
            </h3>
            
            <div id="admin-projects-list" class="space-y-3 max-h-80 overflow-y-auto p-1">
                <p class="text-center text-xs text-gray-500">جاري تحميل المشاريع...</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBI_-xyfznsUZOdDPRRG3TDaxbtgfqteL8",
            authDomain: "turbofront-23e10.firebaseapp.com",
            projectId: "turbofront-23e10",
            storageBucket: "turbofront-23e10.firebasestorage.app",
            messagingSenderId: "989007662566",
            appId: "1:989007662566:web:ab90726f1cd01412459a27",
            measurementId: "G-VD89G6W80L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('add-project-form');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const adminList = document.getElementById('admin-projects-list');

        // 1. إضافة مشروع جديد
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('pTitle').value;
            const link = document.getElementById('pLink').value;

            // جلب شعار الموقع تلقائياً
            const logoImage = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(link)}&sz=128`;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري الإضافة...`;
            statusMsg.classList.add('hidden');

            try {
                await addDoc(collection(db, "projects"), {
                    title: title,
                    link: link,
                    image: logoImage,
                    createdAt: serverTimestamp()
                });

                statusMsg.innerText = "تمت إضافة المشروع بنجاح!";
                statusMsg.className = "mt-4 text-center text-xs font-bold text-green-600";
                statusMsg.classList.remove('hidden');
                
                form.reset();
            } catch (error) {
                statusMsg.innerText = "حدث خطأ أثناء الإضافة: " + error.message;
                statusMsg.className = "mt-4 text-center text-xs font-bold text-red-600";
                statusMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fas fa-plus"></i> إضافة المشروع للمعرض`;
            }
        });

        // 2. عرض المشاريع الحالية وإتاحة زر الحذف
        const q = collection(db, "projects");
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                adminList.innerHTML = '<p class="text-center text-xs text-gray-500 py-4">لا توجد مشاريع مضافة حالياً.</p>';
                return;
            }

            adminList.innerHTML = snapshot.docs.map(document => {
                const proj = document.data();
                const docId = document.id;
                return `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${proj.image}" class="w-8 h-8 object-contain shrink-0 rounded-full bg-white p-1 border" onerror="this.src='https://placehold.co/100x100/2563eb/FFF?text=Logo'">
                            <div class="truncate">
                                <h4 class="font-bold text-xs text-gray-800 truncate">${proj.title}</h4>
                                <a href="${proj.link}" target="_blank" class="text-[10px] text-blue-600 hover:underline truncate block">${proj.link}</a>
                            </div>
                        </div>
                        <button onclick="deleteProject('${docId}')" class="bg-red-100 hover:bg-red-600 text-red-600 hover:text-white p-2 rounded-lg text-xs font-bold transition shrink-0 ms-2">
                            <i class="fas fa-trash-alt"></i> حذف
                        </button>
                    </div>
                `;
            }).join('');
        });

        // 3. دالة حذف مشروع من قاعدة البيانات
        window.deleteProject = async (id) => {
            if (confirm("هل أنت تأكد من رغبتك في حذف هذا المشروع من المعرض؟")) {
                try {
                    await deleteDoc(doc(db, "projects", id));
                } catch (error) {
                    alert("حدث خطأ أثناء الحذف: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
